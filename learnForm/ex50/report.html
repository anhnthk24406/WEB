<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Ex 50 - Nguyễn Thị Hồng Ánh</title>

    <style>
        body {
            font-family: "Times New Roman", serif;
            font-size: 16px;
            background-color: white;
            margin: 0;
        }

        #container {
            width: 720px;
            margin: 10px auto;
            padding: 10px;
            background-color: #ccffff;
            border: 2px solid #0066ff;
            box-sizing: border-box;
        }

        .logo {
            text-align: center;
            margin-bottom: 15px;
        }

        .logo img {
            width: 455px;
        }

        h2 {
            margin: 0 0 18px 0;
        }

        hr {
            border: 0;
            border-top: 1px solid gray;
            margin-bottom: 15px;
        }

        p {
            margin: 12px 0;
        }

        input[type="text"] {
            height: 21px;
            box-sizing: border-box;
        }

        #first_name,
        #last_name {
            width: 120px;
        }

        #number {
            width: 75px;
        }

        #purpose {
            width: 440px;
            height: 65px;
            resize: none;
        }

        table {
            border-collapse: collapse;
            margin-top: 8px;
        }

        th,
        td {
            border: 1px solid #888;
            padding: 2px;
        }

        th {
            text-align: center;
        }

        .date {
            width: 75px;
        }

        .description {
            width: 175px;
        }

        .category {
            width: 105px;
        }

        .amount {
            width: 60px;
        }

        button {
            font-family: "Times New Roman", serif;
            font-size: 14px;
        }
    </style>

    <script>
        function submitReport() {
            const firstName =
                document.getElementById("first_name").value;

            const lastName =
                document.getElementById("last_name").value;

            let message = "Nộp bài thành công!\n";
            message += "Họ tên: " + firstName + " " + lastName + "\n";

            alert(message);
        }
    </script>
</head>

<body>

    <div id="container">

        <!-- Logo -->
        <div class="logo">
            <img src="images/DeLong.jpg" alt="DeLong Enterprises">
        </div>

        <h2>Travel Expense Report</h2>

        <hr>

        <form name="report">

            <!-- 1 -->
            <p>
                1) First Name:
                <input type="text"
                       name="first_name"
                       id="first_name">

                Last Name:
                <input type="text"
                       name="last_name"
                       id="last_name">
            </p>

            <!-- 2 -->
            <p>
                2) Social Security Number:
                <input type="text"
                       name="number"
                       id="number">
            </p>

            <!-- 3 -->
            <p>
                3) Department:

                <select name="department">
                    <option>Accounting</option>
                    <option>Sales</option>
                    <option>Marketing</option>
                    <option>Legal</option>
                    <option>HR</option>
                    <option>Logistics</option>
                </select>
            </p>

            <!-- 4 -->
            <p>
                4) Describe the purpose of your trip
            </p>

            <textarea name="purpose"
                      id="purpose"></textarea>

            <!-- 5 -->
            <p>
                5) Itemize your travel expenses
            </p>

            <table>

                <tr>
                    <th>Date</th>
                    <th>Description</th>
                    <th>Category</th>
                    <th>Amount</th>
                </tr>

                <tr>
                    <td>
                        <input type="text"
                               name="date1"
                               class="date"
                               placeholder="mm/dd/yy">
                    </td>

                    <td>
                        <input type="text"
                               name="description1"
                               class="description">
                    </td>

                    <td>
                        <select name="category1"
                                class="category">
                            <option>Meal</option>
                            <option>Drink</option>
                            <option>Food</option>
                            <option>Thing</option>
                        </select>
                    </td>

                    <td>
                        <input type="text"
                               name="amount1"
                               class="amount">
                    </td>
                </tr>

                <tr>
                    <td>
                        <input type="text"
                               name="date2"
                               class="date"
                               placeholder="mm/dd/yy">
                    </td>

                    <td>
                        <input type="text"
                               name="description2"
                               class="description">
                    </td>

                    <td>
                        <select name="category2"
                                class="category">
                            <option>Meal</option>
                            <option>Drink</option>
                            <option>Food</option>
                            <option>Thing</option>
                        </select>
                    </td>

                    <td>
                        <input type="text"
                               name="amount2"
                               class="amount">
                    </td>
                </tr>

                <tr>
                    <td>
                        <input type="text"
                               name="date3"
                               class="date"
                               placeholder="mm/dd/yy">
                    </td>

                    <td>
                        <input type="text"
                               name="description3"
                               class="description">
                    </td>

                    <td>
                        <select name="category3"
                                class="category">
                            <option>Meal</option>
                            <option>Drink</option>
                            <option>Food</option>
                            <option>Thing</option>
                        </select>
                    </td>

                    <td>
                        <input type="text"
                               name="amount3"
                               class="amount">
                    </td>
                </tr>

                <tr>
                    <td>
                        <input type="text"
                               name="date4"
                               class="date"
                               placeholder="mm/dd/yy">
                    </td>

                    <td>
                        <input type="text"
                               name="description4"
                               class="description">
                    </td>

                    <td>
                        <select name="category4"
                                class="category">
                            <option>Meal</option>
                            <option>Drink</option>
                            <option>Food</option>
                            <option>Thing</option>
                        </select>
                    </td>

                    <td>
                        <input type="text"
                               name="amount4"
                               class="amount">
                    </td>
                </tr>

            </table>

            <!-- 6 -->
            <p>
                6) Have you submitted your receipts?

                <input type="radio"
                       name="receipts"
                       id="submit1"
                       value="Yes">

                <label for="submit1">Yes</label>

                <input type="radio"
                       name="receipts"
                       id="submit2"
                       value="No">

                <label for="submit2">No</label>
            </p>

            <!-- Buttons -->
            <button type="button"
                    onclick="submitReport()">
                Submit travel expenses
            </button>

            <button type="reset">
                Reset
            </button>

            <br>

            <p>
                Questions? Contact Debbie Larson in Accounting (ext. 2150)
            </p>

        </form>

    </div>

</body>

</html>
